name: Update Blog Content

on:
  schedule:
    # Run at 21:00 UTC (6:00 AM JST) every day
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install jsdom

      - name: Run update script
        run: node scripts/update_blog.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes_exist=true" >> $GITHUB_OUTPUT

      - name: Commit and Push if changes exist
        if: steps.git-check.outputs.changes_exist == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add blog.html
          git commit -m "Auto-update blog content from Note RSS"
          git push
